<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | FluxLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="centered-page">
    <a class="skip-link" href="#login-main">Skip to login form</a>

    <main id="login-main" class="login-wrapper card-3d" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back</h1>
      <p class="subtext">Sign in to continue tracking your expenses in real time.</p>

      <form class="login-form" action="./dashboard.html" method="get">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />

        <button type="submit" class="btn btn-primary">Enter Dashboard</button>
      </form>

      <p><a href="./index.html">← Back to Landing Page</a></p>
    </main>
  </body>
</html>
